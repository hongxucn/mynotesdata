<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modern Tab Editor</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f8f9fa;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        #saveButton {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        #saveButton:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .save-alert {
            color: #dc3545;
            font-weight: 500;
            display: none;
            padding: 8px 12px;
            background: #ffeef0;
            border-radius: 4px;
        }

        .save-success {
            color: #28a745;
            font-weight: 500;
            display: none;
            padding: 8px 12px;
            background: #e8f5e9;
            border-radius: 4px;
        }

        .logmsg {
            display: none;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 4px;
        }

        .controls-row {
            margin-bottom: 30px;
        }

        .tabs-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
        }

        .tab {
            display: flex;
            align-items: center;
            padding: 8px 20px;
            background: #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            user-select: none;
            min-width: 60px;
            max-width: 300px;
            border: 1px solid transparent;
        }

        .tab.active {
            background: #2c3e50;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-color: #1a2530;
        }

        .tab:hover:not(.active) {
            background: #dee2e6;
            transform: translateY(-1px);
        }

        .tab .title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            font-size: 14px;
        }

        .tab input {
            background: rgba(255,255,255,0.2) !important;
            padding: 2px 5px !important;
            border-radius: 3px !important;
        }

        .close-btn {
            margin-left: 12px;
            color: inherit;
            opacity: 0.7;
            font-weight: 600;
            font-size: 16px;
            flex-shrink: 0;
            transition: opacity 0.2s;
        }

        .close-btn:hover {
            opacity: 1;
        }

        #addTab {
            padding: 8px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        #addTab:hover {
            background: #0056b3;
            transform: translateY(-1px);
        }

        #Debug {
            padding: 8px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        #Debug:hover {
            background: #0056b3;
            transform: translateY(-1px);
        }

        #LoadDB {
            padding: 8px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        #LoadDB:hover {
            background: #0056b3;
            transform: translateY(-1px);
        }

        #DeleteFile {
            padding: 8px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        #DeleteFile:hover {
            background: #0056b3;
            transform: translateY(-1px);
        }
        
        #editor {
            width: 100%;
            height: 400px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Fira Code', monospace;
            resize: vertical;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        #editor:focus {
            border-color: #007bff;
            outline: none;
        }

        .tab.dragging {
            opacity: 0.5;
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="header">
        <button id="saveButton" disabled>保存更改</button>
        <span class="save-alert">有未保存的修改！</span>
        <span class="save-success">保存成功！</span>
        <div>
            <span class="logmsg"></span>
        </div>
    </div>
    
    <div class="controls-row">
        <button id="addTab">+ 新建标签</button>
        <button id="DeleteFile">Delete File</button>
        <button id="LoadDB">Load DB</button>
        <button id="Debug">debug!</button>
    </div>
    
    <div class="tabs-container" id="tabsContainer"></div>
    
    <textarea id="editor"></textarea>

    <script>
        let tabs = [];
        let activeTab = null;
        let isModified = false;
        let dragSrcEl = null;
		let seperator = "===-====-";
        let mypassword = "mypassword";
        let savedTime = 0;
        let tabCounter = 0;

        const repoOwner = 'hongxucn';
        const repoName = 'mynotesdata';
        const token = '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';
        const noteName = 'mynotes.db'
        const url = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${noteName}`;

        const DB_NAME = "MyGithubNotes";
        const STORE_NAME = "content";

        const mytext = `1711438523456
===-====- 小结 1
这里是小结 1 的内容
可以有多行

这是小结 2 的第一行
这是小结 2 的第二行`;

        const salt = new Uint8Array(
            [31, 72, 43, 41, 211, 135, 171, 187,
             209, 210, 121, 152, 51, 114, 215, 116]
        );

        const iv = new Uint8Array(
            [213, 129, 3, 204, 111, 176, 37, 158,
            91, 107, 171, 123]
        );

        function infoMsg(txt) {
            const msg = document.querySelector('.logmsg');
            msg.textContent = txt;
            msg.style.display = 'inline';
            msg.style.color = 'darkgreen';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 2000);
        }

        function errMsg(txt) {
            const msg = document.querySelector('.logmsg');
            msg.textContent = txt;
            msg.style.display = 'inline';
            msg.style.color = 'red';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 2000);
        }

        function _openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);

                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "id" });
                    }
                };

                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject("数据库打开失败");
            });
        }

        // 写入字符串
        async function saveDB(text) {
            const db = await _openDB();
            const tx = db.transaction(STORE_NAME, "readwrite");
            const store = tx.objectStore(STORE_NAME);
            store.put({ id: "content", content: text });

            return new Promise((resolve, reject) => {
                tx.oncomplete = () => resolve("数据已存储");
                tx.onerror = () => reject("存储失败");
            });
        }

        // 读取字符串
        async function readDB() {
            const db = await _openDB();
            const tx = db.transaction(STORE_NAME, "readonly");
            const store = tx.objectStore(STORE_NAME);
            const id = "content";
            const request = store.get(id);

            return new Promise((resolve, reject) => {
                request.onsuccess = () => resolve(request.result ? request.result.content : null);
                request.onerror = () => reject("读取失败");
            });
        }

        function parseNotesFile(input) {
            const lines = input.split("\n");
            if (lines.length < 2) {
                throw new Error("Notes db file corrupted!");
            }

            const lastSavedTime = parseInt(lines[0].trim(), 10);
            if (isNaN(lastSavedTime)) {
                throw new Error("timestamp corrupted!");
            }

            const sections = [];
            let currentSection = null;

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trimEnd();
                const match = line.match(/^===-====-\s*(.+)$/);
                if (match) {
                    // save last section
                    if (currentSection) {
                        sections.push(currentSection);
                    }
                    // start a new section
                    currentSection = {
                        title: match[1],
                        content: ""
                    };
                } else if (currentSection) {
                    currentSection.content += (line + "\n");
                }
            }

            // save the last section
            if (currentSection) {
                sections.push(currentSection);
            }

            return { lastSavedTime, sections };
        }

        function generateDocument() {
            let content = "";
            const id =  Date.now();
            if (tabs.length < 1) {
                return false;
            }
            content += id;
            content += "\n";
            tabs.forEach(tab => {
                content += `===-====- ${tab.title}\n${tab.content.trimEnd()}\n`;
            });

            // drop the last "\n" appended above
            return content.slice(0, -1);
        }

        function safe_atob(a) {
            return atob(a.replace(/-/g, '+').replace(/_/g, '/'));
        }

        function safe_btoa(b) {
            return btoa(b).replace(/\+/g, '-').replace(/\//g, '_');
        }

        function base64Encode(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }

        function base64Decode(base64Str) {
            return decodeURIComponent(escape(atob(base64Str)));
        }

        // data: a String which may contain Chinese letters
        async function encryptData(password, data) {
            const keyMaterial = await crypto.subtle.importKey(
                "raw",
                new TextEncoder().encode(password),
                "PBKDF2",
                false,
                ["deriveKey"]
            );
            const key = await crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt,
                    iterations: 100000,
                    hash: "SHA-256"
                },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt"]
            );

            const encrypted = await crypto.subtle.encrypt(
                { name: "AES-GCM", iv },
                key,
                new TextEncoder().encode(data)
            );
            return base64Encode(String.fromCharCode.apply(null, new Uint8Array(encrypted)));
        }

        async function decryptData(password, encryptedData) {
            encrypted = encryptedData;
            const keyMaterial = await crypto.subtle.importKey(
                "raw",
                new TextEncoder().encode(password),
                "PBKDF2",
                false,
                ["deriveKey"]
            );
            const key = await crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: 100000,
                    hash: "SHA-256"
                },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );
            const decrypted = await crypto.subtle.decrypt(
                {
                    name: "AES-GCM",
                    iv: iv
                },
                key,
                new Uint8Array(base64Decode(encrypted).split("").map(char => char.charCodeAt(0)))
            );
            return new TextDecoder().decode(decrypted);
        }

        function setModified() {
            if (!isModified) {
                isModified = true;
                document.querySelector('.save-alert').style.display = 'inline';
                document.getElementById('saveButton').disabled = false;
            }
        }

        function calculateTabWidth(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.font = '14px "Segoe UI"';
            const textWidth = ctx.measureText(text).width;
            return Math.min(textWidth + 40, 300);
        }

        async function loadTabsFromDB() {
            const txt = await readDB();
            const notesData = parseNotesFile(txt);
            if (notesData) {
                notesData.sections.forEach(section => {
                    createTab(section.title, section.content);
                });
            } else {
                createTab();
            }
            activateTab(tabs[0].id);
        }

        async function loadTabsFromGithub() {
            const {status, content: encrypted_content} = await doDownloadFile();

            if (status == 0) {
                const content_deccrypted = await decryptData(mypassword, encrypted_content);
                //console.log("get data from github:");
                //console.log(content_deccrypted + "~~~");
                //console.log("=== end");
                const notesData = parseNotesFile(content_deccrypted);
                if (notesData) {
                    notesData.sections.forEach(section => {
                        // console.log(`title: ${section.title}`);
                        // console.log(`content:\n${section.content}`);
                        createTab(section.title, section.content);
                    });
                } else {
                    createTab();
                }
            } else if (status == 404) {
                createTab("New File", "");
            } else {
                errMsg("Network issue, please reload");
                return;
            }

            activateTab(tabs[0].id);
        }

        function createTab(title = '未命名标签', content = '') {
            const tab = {
                id: tabCounter++,
                title,
                content,
                element: null
            };

            const tabEl = document.createElement('div');
            tabEl.className = 'tab';
            tabEl.draggable = true;
            tabEl.style.width = `${calculateTabWidth(title)}px`;
            tabEl.innerHTML = `
                <span class="title" title="${title}">${title}</span>
                <span class="close-btn">&times;</span>
            `;

            tabEl.addEventListener('click', () => activateTab(tab.id));
            tabEl.querySelector('.close-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                closeTab(tab.id);
                if (tabs.length == 0) {
                    const tab = createTab();
                    renameTab(tab.element);
                }
                setModified();
            });
            tabEl.addEventListener('dblclick', () => renameTab(tabEl));
            tabEl.addEventListener('dragstart', handleDragStart);
            tabEl.addEventListener('dragover', handleDragOver);
            tabEl.addEventListener('drop', handleDrop);
            tabEl.addEventListener('dragend', handleDragEnd);

            tab.element = tabEl;
            document.querySelector('#tabsContainer').appendChild(tabEl);
            tabs.push(tab);
            return tab;
        }

        function activateTab(id) {
            tabs.forEach(tab => {
                const isActive = tab.id === id;
                tab.element.classList.toggle('active', isActive);
                if (isActive) {
                    activeTab = tab;
                    document.getElementById('editor').value = tab.content;
                }
            });
        }

        function closeTab(id) {
            const index = tabs.findIndex(t => t.id === id);
            if (index === -1) return;

            const tab = tabs[index];
            tab.element.remove();
            tabs.splice(index, 1);

            if (activeTab?.id === id) {
                activeTab = tabs.length > 0 ? tabs[Math.max(index - 1, 0)] : null;
                if (activeTab) {
                    activateTab(activeTab.id);
                } else {
                    document.getElementById('editor').value = '';
                }
            }
        }

        function renameTab(tabEl) {
            const titleSpan = tabEl.querySelector('.title');
            const originalTitle = titleSpan.textContent;
            const input = document.createElement('input');
            input.type = 'text';
            input.value = originalTitle;
            input.style.cssText = `
                width: 100%;
                background: transparent;
                border: none;
                color: inherit;
                font: inherit;
                padding: 0;
                outline: none;
            `;

            titleSpan.replaceWith(input);

            const finishRename = (viaEnter = false) => {
                //if (!document.body.contains(input)) return;
                if (!input.isConnected) return;

                const newTitle = input.value.trim();
                if (newTitle && newTitle !== originalTitle) {
                    const newTitleSpan = titleSpan.cloneNode(true);
                    newTitleSpan.textContent = newTitle;
                    newTitleSpan.title = newTitle;

                    input.replaceWith(newTitleSpan);

                    const tab = tabs.find(t => t.element === tabEl);
                    tab.title = newTitle;
                    tabEl.style.width = `${calculateTabWidth(newTitle)}px`;
                    setModified();
                } else {
                    input.replaceWith(titleSpan);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    // below lines can work but looks a little strange
                    // e.preventDefault(); // 阻止默认行为
                    // input.removeEventListener('blur', handleBlur);
                    // finishRename(true);

                    // below lines can work and looks good to me
                    e.preventDefault(); // 阻止默认行为
                    console.log("call blur...");
                    e.target.blur();
                    document.getElementById('editor').focus();
                }
            };

            const handleBlur = () => {
                console.log("handleBlur...");
                finishRename();
                input.removeEventListener('keydown', handleKeyDown);
            };

            input.addEventListener('blur', handleBlur);

            input.addEventListener('keydown', handleKeyDown);

            input.select();
            input.focus();
        }

        function handleDragStart(e) {
            dragSrcEl = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e) {
            e.preventDefault();
            if (dragSrcEl !== this) {
                const tabsContainer = document.querySelector('#tabsContainer');
                const tabsArray = Array.from(tabsContainer.children);
                const srcIndex = tabsArray.indexOf(dragSrcEl);
                const destIndex = tabsArray.indexOf(this);

                if (srcIndex < destIndex) {
                    tabsContainer.insertBefore(dragSrcEl, this.nextSibling);
                } else {
                    tabsContainer.insertBefore(dragSrcEl, this);
                }

                const draggedTab = tabs.find(t => t.element === dragSrcEl);
                tabs.splice(srcIndex, 1);

                const newTabsArray = Array.from(tabsContainer.children);
                const newIndex = newTabsArray.indexOf(dragSrcEl);
                tabs.splice(newIndex, 0, draggedTab);
                setModified();
            }
        }

        function handleDragEnd() {
            this.classList.remove('dragging');
        }

        async function doDebug() {

            if (0) {

        function closeAllTabs() {
            while (tabs.length > 0) {
                closeTab(tabs[0].id);
            }
        }

        async function doLoadDB() {
            // close all Tabs firstly
            closeAllTabs();

            loadTabsFromDB();
        }

        async function doDeleteFile() {
            const getResponse = await fetch(url, {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Accept": "application/vnd.github.v3+json"
                }
            });
            if (!getResponse.ok) {
                console.log("failed to get SHA from github");
                return;
            }

            const fileData = await getResponse.json();
            const fileSHA = fileData.sha;


            // delete file
            const deleteResp = await fetch(url, {
                method: "DELETE",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json",
                    "Accept": "application/vnd.github.v3+json"
                },
                body: JSON.stringify({
                    message: `Delete file ${noteName}`,
                    sha: fileSHA
                })
            });
            if (!deleteResp.ok) {
                console.log("failed to delete file");
                return;
            }
            infoMsg("File has been deleted");
        }

        async function doDownloadFile() {
            try {
                const resp = await fetch(url, {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Accept": "application/vnd.github.v3+json"
                    }
                });
                if (resp.ok) {
                    const data = await resp.json();
                    const txt = base64Decode(data.content);
                    return { status: 0, content: txt };
                } else {
                    return {status: resp.status, content:null};
                }
            } catch (error) {
                return {status: 1, content: null};
            }
            return {status: 0, content: null};
        }

        async function doUploadFile(content) {
            let fileSHA = null;
            const getResponse = await fetch(url, {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Accept": "application/vnd.github.v3+json"
                }
            });
            if (getResponse.ok) {
                const fileData = await getResponse.json();
                fileSHA = fileData.sha;
            }

            const response = await fetch(url, {
                method: "PUT",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: `Update file ${noteName}`,
                    sha: fileSHA,
                    content: base64Encode(content),
                    ...(fileSHA && { fileSHA })
                })
            });
            if (!response.ok) {
                throw new Error(`Failed to upload to GitHub: ${response.statusText}`);
            }
        }

        document.getElementById('editor').addEventListener('input', function() {
            if (activeTab) {
                activeTab.content = this.value;
                setModified();
            }
        });

        document.getElementById('saveButton').addEventListener('click', async () => {
            isModified = false;
            document.querySelector('.save-alert').style.display = 'none';
            const successMsg = document.querySelector('.save-success');
            successMsg.style.display = 'inline';
            document.getElementById('saveButton').disabled = true;

            const content = generateDocument();
            await saveDB(content);
            const content_encrypted = await encryptData(mypassword, content);
            doUploadFile(content_encrypted);
            
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 2000);
        });

        document.getElementById('addTab').addEventListener('click', () => {
            const tab = createTab();
            activateTab(tab.id);
            renameTab(tab.element);
        });

        document.getElementById('Debug').addEventListener('click', async () => {
            await doDebug();
        });

        document.getElementById('LoadDB').addEventListener('click', async () => {
            await doLoadDB();
        });

        document.getElementById('DeleteFile').addEventListener('click', async () => {
            await doDeleteFile();
        });

        loadTabsFromGithub();
    </script>
</body>
